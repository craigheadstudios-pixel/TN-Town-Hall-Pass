# Jurisdictions tracked by TN Town Hall Pass.
#
# Each entry:
#   id            - unique slug, used in generated filenames (feeds/jurisdictions/<id>.ics)
#   county        - TN county name, no "County" suffix
#   jurisdiction  - display name, e.g. "Rutherford County" or "City of Murfreesboro"
#   body          - the specific board/council, e.g. "County Commission", "City Council", "Board of Education"
#   category      - one of: county_commission | city_council | school_board | other
#   platform      - one of: legistar | ical | civicengage | civicclerk | boarddocs |
#                    boeconnect | granicus_html | primegov | manual
#   calendar_url  - the meeting calendar/agenda page (or, for platform: ical, the
#                    direct .ics feed URL itself)
#   timezone      - IANA tz name (default America/Chicago; all six pilot counties
#                    are Middle TN / Central time)
#
# Platform-specific options:
#   legistar_client   - (platform: legistar) the Legistar subdomain client name
#   body_name         - (platform: legistar) restrict to one EventBodyName if the
#                        client hosts multiple boards
#   meetings          - (platform: manual) hand-curated list of {title, start, end,
#                        location, agenda_url, notes} until a real adapter exists
#   category_name      - (platform: civicengage) the board name as it should appear
#                        in an on-page heading on the AgendaCenter page, used to
#                        filter out other boards sharing the same AgendaCenter.
#                        Leave unset when calendar_url is already scoped to one
#                        category (e.g. a /AgendaCenter/<Board>-<id> sub-path).
#   default_time        - (platform: civicengage) "HH:MM" 24h fallback used when no
#                        meeting time can be found in the agenda link's text
#   platform_hint      - vendor identified by research but not yet wired up as an
#                        automated adapter (boarddocs/boeconnect/civicclerk adapters
#                        aren't implemented yet -- see README's platform table).
#                        Once an adapter exists and the exact feed URL is confirmed
#                        live, flip `platform:` to match and drop this hint.
#   research_note      - caveat from the research pass, e.g. when a URL/platform
#                        was inferred from search results rather than a live fetch
#
# NOTE ON CURRENT STATUS: this sandbox's network policy blocks outbound requests
# to arbitrary .gov/.com/.org domains (see docs/COVERAGE.md), so none of the URLs
# below have been fetched live from here -- they come from a research pass done
# via web search only. The `platform: civicengage` entries run against a real
# adapter (scraper/platforms/civicengage.py) but its exact AgendaCenter markup
# assumptions are themselves unverified against a live page -- first real signal
# on whether they work comes from a GitHub Actions run, which has normal internet
# access. Every other entry is still `platform: manual` with `meetings: []` until
# someone confirms the actual feed/page live and either fills in real meetings or
# wires up a working adapter for that platform.

