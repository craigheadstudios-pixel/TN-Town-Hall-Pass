name: Update feeds and deploy site

on:
  schedule:
    # Once a day. GitHub Actions runners have normal internet access (unlike
    # the sandbox this project was scaffolded in), so this is where sources
    # actually get fetched live.
    - cron: "17 11 * * *"
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "sources.yaml"
      - "scraper/**"
      - "site/**"
      - ".github/workflows/update-feeds.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      feeds_changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper pipeline
        run: python -m scraper.run

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- site/feeds site/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed feeds and data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/feeds site/data
          git commit -m "Refresh meeting feeds"
          git push

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
